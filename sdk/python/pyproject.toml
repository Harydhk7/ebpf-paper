[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "intentguard-ebpf"
version = "0.1.0"
description = "Runtime syscall containment for agent processes"
requires-python = ">=3.9"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
