name: Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  daemon:
    strategy:
      matrix:
        include:
          - arch: amd64
            goarch: amd64
          - arch: arm64
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Install eBPF build tools
        run: sudo apt-get update && sudo apt-get install -y clang llvm bpftool libbpf-dev
      - name: Generate and build
        env:
          GOARCH: ${{ matrix.goarch }}
        run: make daemon && tar -czf intentguardd-linux-${{ matrix.arch }}.tar.gz intentguardd
      - uses: softprops/action-gh-release@v2
        with:
          files: intentguardd-linux-${{ matrix.arch }}.tar.gz
